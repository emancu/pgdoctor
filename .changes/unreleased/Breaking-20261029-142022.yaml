kind: Breaking
body: 'a table fails only when its unprunable statements also take `exec_time_fail_minutes_per_day` (default 5 minutes) of execution time a day, worked out per statement from `stats_since` with pg_stat_statements 1.11 or later; below that it warns. Before 1.11 the daily time is only a lower bound, shown with `≥`, and the call and total-time thresholds decide alone as before. The daily time follows the totals of each table in `partition-key-unused` and fills a new Time/Day column in `join-missing-partition-key`. `partitionusage.New` takes a `partitionusage.Config`'
