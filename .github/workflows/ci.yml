name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  codegen:
    runs-on: ubuntu-latest

    # sqlc resolves every query against a live server. The queries reference
    # columns added in PostgreSQL 17 (pg_replication_slots.invalidation_reason),
    # so generation fails on older majors. pg_stat_statements only needs to be
    # installed, not preloaded — sqlc reads its catalog entries, never its data.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Prepare database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'

      - name: Verify generated code is up to date
        run: |
          sqlc generate
          go generate ./...
          git diff --exit-code

      - name: Validate docs assets
        run: |
          # checks.json must be valid JSON
          jq empty docs/checks.json

          # Every check in the manifest must have a matching markdown file
          for id in $(jq -r '.checks[].id' docs/checks.json); do
            if [ ! -f "docs/checks/${id}.md" ]; then
              echo "::error::Missing docs/checks/${id}.md for check '${id}'"
              exit 1
            fi
          done

          # Required page assets must exist
          for f in docs/index.html docs/logo.png docs/checks.json; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required asset: $f"
              exit 1
            fi
          done

          count=$(jq '.checks | length' docs/checks.json)
          echo "✓ docs/ validated: ${count} checks, all assets present"
